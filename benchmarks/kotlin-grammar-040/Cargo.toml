[package]
name = "kotlin-grammar-040-diagnostic"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive"] }
kotlin-diagnostic-grammar = { package = "tree-sitter-kotlin", git = "https://github.com/fwcd/tree-sitter-kotlin.git", rev = "c10ad83a66c76855e006496db3bdb002afc49203" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tree-sitter = "0.26.11"
