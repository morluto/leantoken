[workspace]

[package]
name = "swift-parse-diagnostic-073"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "swift-parse-diagnostic-073"
path = "../../examples/swift_parse_diagnostic.rs"

[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
tree-sitter = "0.26.11"
swift-diagnostic-grammar = { package = "tree-sitter-swift", version = "=0.7.3" }
