[package]
name = "leantoken-test-suite"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Private domain-oriented integration test support for LeanToken"
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
leantoken = { path = "../.." }
leantoken-test-support = { path = "../test-support" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.49.0", features = ["macros", "rt", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
directories = "6.0.0"

[dev-dependencies]
rmcp = { version = "=3.1.0", default-features = false, features = ["client", "transport-async-rw"] }
tempfile = "3.23.0"
tokio = { version = "1.49.0", features = ["test-util"] }
