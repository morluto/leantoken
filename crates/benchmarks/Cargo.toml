[dependencies]
blake3 = "1.8.2"
clap = { version = "4.5.51", features = ["derive"] }
leantoken = { path = "../.." }
regex = "1.12.2"
rmcp = { version = "=3.0.0-beta.2", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shell-words = "1.1.1"
statrs = "0.18.0"
tempfile = "3.23.0"
tokio = { version = "1.49.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time", "test-util"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
unidiff = { version = "0.4.0", default-features = false }
wait-timeout = "0.2.1"
