name: Paired performance

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Git revision to compare with the selected workflow revision
        required: true
        default: HEAD^
        type: string
      pairs:
        description: Counterbalanced A/B pairs (10 minimum for decision evidence)
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: paired-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Clean-worktree A/B comparison
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: "1.95"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.0"
          cache: false

      - name: Install pinned Benchstat
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          benchstat_version="$(jq -r '.benchstat_version' benchmarks/paired_performance.json)"
          go install "golang.org/x/perf/cmd/benchstat@${benchstat_version}"
          echo "${GOBIN}" >> "${GITHUB_PATH}"

      - name: Run counterbalanced comparison
        env:
          BASE_REF: ${{ inputs.base_ref }}
          PAIRS: ${{ inputs.pairs }}
        run: |
          benchmarks/run_paired_performance.sh \
            "${BASE_REF}" \
            target/paired-performance \
            "${PAIRS}"

      - name: Add report to workflow summary
        if: always()
        run: |
          if [[ -f target/paired-performance/report.md ]]; then
            cat target/paired-performance/report.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload raw samples and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-performance-${{ github.run_id }}
          path: target/paired-performance/
          if-no-files-found: warn
          retention-days: 30
