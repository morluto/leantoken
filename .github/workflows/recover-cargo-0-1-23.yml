name: Recover Cargo publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Cargo version to publish from its immutable tag
        required: true
        default: "0.1.23"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify Cargo package
        run: cargo publish -p leantoken --locked --dry-run

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish Cargo package
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "leantoken") | .version')
          crate_url="https://crates.io/api/v1/crates/leantoken/$version"
          crate_json_path="$RUNNER_TEMP/leantoken-$version.json"
          user_agent="leantoken-release (+https://github.com/morluto/leantoken)"
          status=$(curl --location --retry 3 --silent --show-error --user-agent "$user_agent" --output "$crate_json_path" --write-out '%{http_code}' "$crate_url" || true)
          case "$status" in
            200)
              if jq -e --arg version "$version" '.version.num == $version and (.version.yanked | not)' "$crate_json_path" >/dev/null; then
                echo "leantoken@$version is already published"
                exit 0
              fi
              echo "leantoken@$version exists on crates.io but is yanked" >&2
              exit 1
              ;;
            404)
              cargo publish -p leantoken --locked
              ;;
            *)
              echo "Could not determine whether leantoken@$version is published on crates.io (HTTP $status)" >&2
              exit 1
              ;;
          esac
