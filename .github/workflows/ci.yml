name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      manifests: ${{ steps.filter.outputs.manifests }}
      npm: ${{ steps.filter.outputs.npm }}
      release: ${{ steps.filter.outputs.release }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7

      - name: Classify changed paths
        id: filter
        if: github.event_name != 'schedule'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            manifests:
              - '**/Cargo.toml'
              - 'Cargo.lock'
            rust:
              - 'src/**'
              - 'crates/**'
              - 'xtask/**'
              - 'tests/**'
              - 'examples/**'
              - 'fixtures/**'
              - 'benchmarks/**/*.json'
              - 'benchmarks/**/*.jsonl'
              - 'benchmarks/run_paired_performance.sh'
              - 'scripts/paired_performance.py'
              - 'scripts/test_agent_walltime_ab.py'
              - 'scripts/test_paired_performance.py'
              - 'README.md'
              - 'docs/usage.md'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/paired-performance.yml'
            npm:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'npm/**'
              - 'scripts/build-npm-packages.mjs'
              - '.github/workflows/ci.yml'
            release:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'dist-workspace.toml'
              - '.github/workflows/release.yml'
              - '.github/workflows/build-npm-packages.yml'
              - 'npm/**'
              - 'scripts/build-npm-packages.mjs'

  quality:
    name: Code quality checks
    needs: changes
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        if: needs.changes.outputs.npm == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-workspace-crates: true

      - name: Verify locked dependency graph
        if: needs.changes.outputs.rust == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check duplicate files
        run: bash scripts/check-duplicates.sh

      - name: Test development support scripts
        run: |
          python3 -m unittest \
            scripts/test_report_target_footprint.py \
            scripts/test_validate_agents_md.py

      - name: Validate AGENTS.md
        run: bash scripts/validate-agents-md.sh

      - name: Test npm packaging
        if: needs.changes.outputs.npm == 'true'
        run: node --test npm/npm-packaging.test.mjs

      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: Check test architecture
        if: needs.changes.outputs.rust == 'true'
        run: cargo xtask check-test-architecture

      - name: Lint all targets
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Validate public API documentation
        if: needs.changes.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Upload documentation for deployment
        if: needs.changes.outputs.rust == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          retention-days: 7

  secret-scan:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
          cache-workspace-crates: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  unused-deps:
    name: Unused dependencies
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: udeps
          cache-workspace-crates: true

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: Check unused dependencies
        run: cargo +nightly udeps --all-targets --all-features

  release-plan:
    name: Release plan
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install dist
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.32.0

      - name: Validate release plan
        run: dist plan

  ci:
    name: ${{ matrix.os }}
    needs: changes
    if: github.event_name != 'schedule' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.npm == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        if: needs.changes.outputs.npm == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-workspace-crates: true

      - name: Test npm installation
        if: needs.changes.outputs.npm == 'true'
        timeout-minutes: 5
        run: node --test npm/npm-install-e2e.mjs

      - name: Test library and binary units
        if: needs.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: cargo test --locked --workspace --all-features --lib --bins

      - name: Test integration behavior
        if: needs.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: "cargo test --locked --package leantoken --all-features --test integration -- --skip process::"

      - name: Test executable and MCP process behavior
        if: needs.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: "cargo test --locked --package leantoken --all-features --test integration process:: -- --test-threads=2"

      - name: Test checked-in fixture cases
        if: needs.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: cargo xtask test fixtures

      - name: Test token-economy contract
        if: needs.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: cargo test-contract

      - name: Upload preserved test failures
        if: always() && needs.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.os }}-${{ github.sha }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 7

  scheduled-stress:
    name: Nightly stress (${{ matrix.os }})
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            repetitions: 100
          - os: macos-latest
            repetitions: 25
          - os: windows-latest
            repetitions: 25
    defaults:
      run:
        shell: bash
    env:
      LEANTOKEN_STRESS_REPETITIONS: ${{ matrix.repetitions }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stress-${{ matrix.os }}
          cache-workspace-crates: true

      - name: Run repeated process lifecycle evidence
        run: cargo xtask test stress

      - name: Upload preserved test failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-failures-${{ matrix.os }}-${{ github.sha }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 14

  scheduled-profile:
    name: Weekly test profile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: profile
          cache-workspace-crates: true

      - name: Profile merge tests without retries
        run: cargo xtask test profile

  example-tests:
    name: Benchmark and example tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: example-tests
          cache-workspace-crates: true

      - name: Test benchmark, example, and documentation targets
        run: |
          cargo test --locked --package leantoken --all-features --examples
          cargo test --locked --workspace --all-features --doc

      - name: Test performance support scripts
        run: |
          python3 -m unittest \
            scripts/test_agent_walltime_ab.py \
            scripts/test_paired_performance.py

  required:
    name: Required checks
    if: always() && github.event_name == 'pull_request'
    needs:
      - changes
      - quality
      - secret-scan
      - dependency-audit
      - unused-deps
      - release-plan
      - ci
      - example-tests
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      UNUSED_DEPS_RESULT: ${{ needs.unused-deps.result }}
      RELEASE_PLAN_RESULT: ${{ needs.release-plan.result }}
      PRODUCT_RESULT: ${{ needs.ci.result }}
      EXAMPLE_TESTS_RESULT: ${{ needs.example-tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      MANIFESTS_CHANGED: ${{ needs.changes.outputs.manifests }}
      RELEASE_CHANGED: ${{ needs.changes.outputs.release }}
      RUST_CHANGED: ${{ needs.changes.outputs.rust }}
      NPM_CHANGED: ${{ needs.changes.outputs.npm }}
    steps:
      - name: Verify relevant jobs passed
        run: |
          failed=0

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with result '$result'"
              failed=1
            fi
          }

          require_when() {
            local condition="$1"
            local name="$2"
            local result="$3"
            if [[ "$condition" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$name unexpectedly finished with result '$result'"
              failed=1
            fi
          }

          require_success "change classification" "$CHANGES_RESULT"
          require_success "code quality" "$QUALITY_RESULT"
          require_success "secret scan" "$SECRET_SCAN_RESULT"
          require_when "$MANIFESTS_CHANGED" "dependency audit" "$DEPENDENCY_AUDIT_RESULT"
          require_when "$MANIFESTS_CHANGED" "unused dependencies" "$UNUSED_DEPS_RESULT"
          require_when "$RELEASE_CHANGED" "release plan" "$RELEASE_PLAN_RESULT"

          product_changed=false
          if [[ "$RUST_CHANGED" == "true" || "$NPM_CHANGED" == "true" ]]; then
            product_changed=true
          fi
          require_when "$product_changed" "cross-platform product tests" "$PRODUCT_RESULT"
          require_when "$RUST_CHANGED" "benchmark and example tests" "$EXAMPLE_TESTS_RESULT"
          require_when "$RUST_CHANGED" "test coverage" "$COVERAGE_RESULT"

          exit "$failed"

  coverage:
    name: Test coverage
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      # Rust attributes `include!` bodies to both the physical source and the
      # include-only façade. Count the physical files, but not those duplicate
      # zero-coverage aliases; mixed façades with executable logic stay gated.
      COVERAGE_IGNORE_REGEX: >-
        concurrency_profile\.rs$|/src/(cache|indexer|parser|ranking|repository|setup|storage|watcher)\.rs$|/src/services/context\.rs$
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-workspace-crates: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Remove stale LLVM profiles
        run: cargo llvm-cov clean --profraw-only

      - name: Run instrumented tests
        run: >
          cargo llvm-cov --locked --all-features --workspace --no-report
          -- --test-threads=2

      - name: Enforce line coverage and write LCOV
        if: success() || failure()
        run: >
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          --fail-under-lines 50

      - name: Print coverage summary
        if: success() || failure()
        run: >
          cargo llvm-cov report
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  docs-deploy:
    name: Deploy API documentation
    needs: [changes, quality]
    if: needs.changes.outputs.rust == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: rustdoc
          path: target/doc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc/
          destination_dir: api
