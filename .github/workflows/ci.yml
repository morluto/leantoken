name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      full_run:
        description: "Select every event-eligible validation lane"
        required: false
        default: false
        type: boolean
      diagnostic:
        description: "Select diagnostic lanes and preserve fallback detail"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected_lanes: ${{ steps.plan.outputs.selected_lanes }}
      unselected_lanes: ${{ steps.plan.outputs.unselected_lanes }}
      fallback_reason: ${{ steps.plan.outputs.fallback_reason }}
      job_matrix: ${{ steps.plan.outputs.job_matrix }}
      job_count: ${{ steps.plan.outputs.job_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install planner Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Resolve event revisions and changed paths
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request) event=pull_request; base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) event=merge_group; base="$MERGE_BASE"; head="$MERGE_HEAD" ;;
            push) event=push; base="$PUSH_BASE"; head="$SOURCE_HEAD" ;;
            schedule) event=schedule; base=""; head="$SOURCE_HEAD" ;;
            workflow_dispatch) event=manual; base=""; head="$SOURCE_HEAD" ;;
            *) echo "Unsupported event $EVENT_NAME" >&2; exit 1 ;;
          esac
          paths="$RUNNER_TEMP/leantoken-changed-paths.txt"
          : > "$paths"
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]] && \
             git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            git diff --name-only -z "$base...$head" > "$paths"
          elif [[ "$event" == "pull_request" || "$event" == "merge_group" ]]; then
            echo "::warning::base or head revision is unavailable; planner will use conservative fallback"
            base=""
          fi
          {
            echo "event=$event"
            echo "schedule=$EVENT_SCHEDULE"
            echo "base=$base"
            echo "head=$head"
            echo "paths=$paths"
            if [[ "$event" == "pull_request" && "$PR_FORK" == "true" ]]; then echo "fork=true"; else echo "fork=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Generate and validate executable CI plan
        id: plan
        env:
          EVENT: ${{ steps.context.outputs.event }}
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          SCHEDULE: ${{ steps.context.outputs.schedule }}
          PATHS: ${{ steps.context.outputs.paths }}
          FORK: ${{ steps.context.outputs.fork }}
          FULL_RUN: ${{ github.event.inputs.full_run }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic }}
        shell: bash
        run: |
          plan="$RUNNER_TEMP/leantoken-ci-plan.json"
          overrides=()
          [[ "$FULL_RUN" == "true" ]] && overrides+=(--full-run)
          [[ "$DIAGNOSTIC" == "true" ]] && overrides+=(--diagnostic)
          [[ "$FORK" == "true" ]] && overrides+=(--fork)
          [[ -n "$SCHEDULE" ]] && overrides+=(--schedule "$SCHEDULE")
          cargo xtask ci plan \
            --event "$EVENT" \
            --base "$BASE" \
            --head "$HEAD" \
            --source "${{ github.sha }}" \
            --changed-paths-file "$PATHS" \
            "${overrides[@]}" \
            --output "$plan"
          cargo xtask ci validate-plan --input "$plan"
          echo "selected_lanes=$(jq -c '[.selected_lanes[].lane]' "$plan")" >> "$GITHUB_OUTPUT"
          echo "unselected_lanes=$(jq -c '[.unselected_lanes[].lane]' "$plan")" >> "$GITHUB_OUTPUT"
          echo "fallback_reason=$(jq -r '.fallback_reason // ""' "$plan")" >> "$GITHUB_OUTPUT"
          echo "job_matrix=$(jq -c '{include: .jobs}' "$plan")" >> "$GITHUB_OUTPUT"
          echo "job_count=$(jq '.jobs | length' "$plan")" >> "$GITHUB_OUTPUT"
          jq '{schema_version, event, schedule, source_revision, topology_digest, selected_lanes, unselected_lanes, jobs, fallback_reason}' "$plan" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable CI plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-plan-${{ github.sha }}
          path: ${{ runner.temp }}/leantoken-ci-plan.json
          overwrite: true
          retention-days: 7

  evidence:
    name: ${{ matrix.lane }} (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.job_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.job_matrix) }}
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout bounded evidence source
        if: matrix.command != 'secret-scan'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_revision }}

      - name: Checkout complete history for secret scanning
        if: matrix.command == 'secret-scan'
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source_revision }}
          fetch-depth: 0

      - name: Install Node.js
        if: matrix.command == 'npm'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust quality toolchain
        if: matrix.command == 'rust-quality'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Install project Rust
        if: contains(fromJSON('["product","contract","examples","release-plan","stress","profile"]'), matrix.command)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Install stable coverage Rust
        if: matrix.command == 'coverage'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools

      - name: Install stable audit Rust
        if: matrix.command == 'dependency-audit'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install nightly Rust
        if: matrix.command == 'dependency-audit'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        if: contains(fromJSON('["rust-quality","product","contract","examples","coverage","dependency-audit","stress","profile"]'), matrix.command)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: evidence-${{ matrix.lane }}-${{ matrix.runner }}
          cache-workspace-crates: true

      - name: Install nextest
        if: matrix.command == 'rust-quality' || matrix.command == 'product' || matrix.command == 'stress' || matrix.command == 'profile'
        uses: taiki-e/install-action@nextest

      - name: Install Gitleaks
        if: matrix.command == 'secret-scan'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          destination="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$destination"
          tar -xzf "$archive" -C "$destination" gitleaks
          echo "$destination" >> "$GITHUB_PATH"

      - name: Install cargo-audit
        if: matrix.command == 'dependency-audit'
        uses: taiki-e/install-action@cargo-audit

      - name: Install cargo-udeps
        if: matrix.command == 'dependency-audit'
        uses: taiki-e/install-action@cargo-udeps

      - name: Install cargo-dist
        if: matrix.command == 'release-plan'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.32.0

      - name: Install cargo-llvm-cov
        if: matrix.command == 'coverage'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run repository static validation
        if: matrix.command == 'quality'
        run: |
          bash scripts/check-duplicates.sh
          python3 -m unittest \
            scripts/test_report_target_footprint.py \
            scripts/test_validate_agents_md.py
          bash scripts/test-ci-secret-scan-range.sh
          bash scripts/validate-agents-md.sh
          mkdir -p target && touch target/ci-command-completed

      - name: Run Rust quality validation
        if: matrix.command == 'rust-quality'
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          cargo fmt --all -- --check
          cargo xtask check-test-architecture
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          mkdir -p target && touch target/ci-command-completed

      - name: Upload documentation for deployment
        if: matrix.command == 'rust-quality' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          overwrite: true
          retention-days: 7

      - name: Run secret scan
        if: matrix.command == 'secret-scan'
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCAN_HEAD: ${{ matrix.source_revision }}
        run: |
          log_options="$(bash scripts/ci-secret-scan-range.sh "$EVENT_NAME" "$SCAN_BASE" "$SCAN_HEAD")"
          gitleaks --redact --timeout=300 git --log-opts="$log_options" .

      - name: Mark secret scan complete
        if: matrix.command == 'secret-scan'
        run: mkdir -p target && touch target/ci-command-completed

      - name: Test product behavior
        if: matrix.command == 'product'
        run: |
          cargo xtask test product --profile ci
          mkdir -p target && touch target/ci-command-completed

      - name: Test token-economy contract
        if: matrix.command == 'contract'
        run: |
          cargo test-contract
          mkdir -p target && touch target/ci-command-completed

      - name: Test npm packaging and installation
        if: matrix.command == 'npm'
        run: |
          node --test npm/npm-packaging.test.mjs
          node --test npm/npm-install-e2e.mjs
          mkdir -p target && touch target/ci-command-completed

      - name: Test benchmark, example, and documentation targets
        if: matrix.command == 'examples'
        run: |
          cargo test --locked --package leantoken-benchmarks --bins
          cargo test --locked --workspace --all-features --doc
          python3 -m unittest \
            scripts/test_agent_walltime_ab.py \
            scripts/test_paired_performance.py
          mkdir -p target && touch target/ci-command-completed

      - name: Audit dependencies and unused entries
        if: matrix.command == 'dependency-audit'
        run: |
          cargo +stable audit
          cargo +nightly udeps --all-targets --all-features
          mkdir -p target && touch target/ci-command-completed

      - name: Validate release plan
        if: matrix.command == 'release-plan'
        run: |
          dist plan
          mkdir -p target && touch target/ci-command-completed

      - name: Remove stale LLVM profiles
        if: matrix.command == 'coverage'
        run: cargo llvm-cov clean --profraw-only

      - name: Run instrumented tests
        if: matrix.command == 'coverage'
        run: >
          cargo llvm-cov --locked --all-features --workspace --no-report
          -- --test-threads=2

      - name: Enforce line coverage and write LCOV
        if: matrix.command == 'coverage' && (success() || failure())
        env:
          COVERAGE_IGNORE_REGEX: >-
            concurrency_profile\.rs$|/src/(cache|cli|doctor|indexer|mcp|parser|ranking|repository|setup|storage|watcher)\.rs$|/src/main/dispatch\.rs$|/src/services/(context|coverage|indexing|json|read|savings|search|startup|status)\.rs$
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COVERAGE_IGNORE_REGEX" --fail-under-lines 50
          cargo llvm-cov report --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          mkdir -p target && touch target/ci-command-completed

      - name: Upload coverage artifact
        if: matrix.command == 'coverage' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov-${{ matrix.receipt_identity }}
          path: lcov.info
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Run repeated process lifecycle evidence
        if: matrix.command == 'stress'
        env:
          LEANTOKEN_STRESS_REPETITIONS: ${{ matrix.repetitions }}
        run: |
          cargo xtask test stress
          mkdir -p target && touch target/ci-command-completed

      - name: Profile merge tests without retries
        if: matrix.command == 'profile'
        run: |
          cargo xtask test profile
          mkdir -p target && touch target/ci-command-completed

      - name: Upload test results and preserved failures
        if: always() && contains(fromJSON('["product","contract","stress","profile"]'), matrix.command)
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.lane }}-${{ matrix.runner }}-${{ github.sha }}
          path: |
            target/nextest/
            target/test-failures/
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14

      - name: Write identity-bound lane receipt
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LANE: ${{ matrix.lane }}
          PLANNED_RUNNER: ${{ matrix.runner }}
          COMMAND_CLASS: ${{ matrix.command }}
          SOURCE_REVISION: ${{ matrix.source_revision }}
          TOPOLOGY_DIGEST: ${{ matrix.topology_digest }}
          RECEIPT_IDENTITY: ${{ matrix.receipt_identity }}
        run: |
          case "$JOB_STATUS" in
            success) status=passed ;;
            failure) status=failed ;;
            cancelled) status=cancelled ;;
            *) status=unexpectedly_skipped ;;
          esac
          if [[ "$status" == passed && ! -f target/ci-command-completed ]]; then
            status=unexpectedly_skipped
          fi
          mkdir -p target/ci-receipt
          jq -n \
            --arg planner_version ci-planner-v3 \
            --arg topology_digest "$TOPOLOGY_DIGEST" \
            --arg source_revision "$SOURCE_REVISION" \
            --arg lane "$LANE" \
            --arg runner "$PLANNED_RUNNER" \
            --arg command "$COMMAND_CLASS" \
            --arg receipt_identity "$RECEIPT_IDENTITY" \
            --arg status "$status" \
            '{schema_version: 2, $planner_version, $topology_digest, $source_revision, $lane, $runner, $command, $receipt_identity, $status}' \
            > "target/ci-receipt/receipt-$RECEIPT_IDENTITY.json"

      - name: Upload lane receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-receipt-${{ matrix.receipt_identity }}
          path: target/ci-receipt/receipt-${{ matrix.receipt_identity }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  required:
    name: Required checks
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: [changes, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install receipt verifier Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Download immutable CI plan
        uses: actions/download-artifact@v8
        with:
          name: ci-plan-${{ github.sha }}
          path: target/ci-plan

      - name: Download lane receipts
        uses: actions/download-artifact@v8
        with:
          pattern: ci-receipt-*
          path: target/ci-receipts
          merge-multiple: true

      - name: Verify selected jobs and receipts
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          FALLBACK_REASON: ${{ needs.changes.outputs.fallback_reason }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::CI planner finished with result '$CHANGES_RESULT'"
            exit 1
          fi
          [[ -z "$FALLBACK_REASON" ]] || echo "::warning::planner fallback: $FALLBACK_REASON"
          cargo xtask ci validate-plan --input target/ci-plan/leantoken-ci-plan.json
          cargo xtask ci validate-receipts \
            --plan target/ci-plan/leantoken-ci-plan.json \
            --receipts target/ci-receipts
          if [[ "$EVIDENCE_RESULT" != "success" ]]; then
            echo "::error::executable evidence matrix finished with result '$EVIDENCE_RESULT'"
            exit 1
          fi

  docs-deploy:
    name: Deploy API documentation
    needs: [changes, evidence]
    if: needs.evidence.result == 'success' && contains(fromJSON(needs.changes.outputs.selected_lanes), 'rust-quality') && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: rustdoc
          path: target/doc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc/
          destination_dir: api
