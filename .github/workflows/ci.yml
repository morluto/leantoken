name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      full_run:
        description: "Select every validation lane"
        required: false
        default: false
        type: boolean
      diagnostic:
        description: "Select diagnostic lanes and preserve fallback detail"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event.schedule }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan CI evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      selected_lanes: ${{ steps.plan.outputs.selected_lanes }}
      unselected_lanes: ${{ steps.plan.outputs.unselected_lanes }}
      fallback_reason: ${{ steps.plan.outputs.fallback_reason }}
      manifests: ${{ steps.filter.outputs.manifests }}
      npm: ${{ steps.filter.outputs.npm }}
      release: ${{ steps.filter.outputs.release }}
      quality: ${{ steps.filter.outputs.quality }}
      rust_quality: ${{ steps.filter.outputs.rust_quality }}
      topology: ${{ steps.filter.outputs.topology }}
      product: ${{ steps.filter.outputs.product }}
      contract: ${{ steps.filter.outputs.contract }}
      examples: ${{ steps.filter.outputs.examples }}
      coverage: ${{ steps.filter.outputs.coverage }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install planner Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Resolve event revisions and changed paths
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          SOURCE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          case "$EVENT_NAME" in
            pull_request) event=pull_request; base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) event=merge_group; base="$MERGE_BASE"; head="$MERGE_HEAD" ;;
            push) event=push; base="$PUSH_BASE"; head="$SOURCE_HEAD" ;;
            schedule) event=schedule; base=""; head="$SOURCE_HEAD" ;;
            workflow_dispatch) event=manual; base=""; head="$SOURCE_HEAD" ;;
            *) echo "Unsupported event $EVENT_NAME" >&2; exit 1 ;;
          esac
          paths="$RUNNER_TEMP/leantoken-changed-paths.txt"
          : > "$paths"
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]] && \
             git cat-file -e "$base^{commit}" 2>/dev/null && git cat-file -e "$head^{commit}" 2>/dev/null; then
            git diff --name-only -z "$base...$head" > "$paths"
          elif [[ "$event" == "pull_request" || "$event" == "merge_group" ]]; then
            echo "::warning::base or head revision is unavailable; planner will use conservative fallback"
            base=""
          fi
          {
            echo "event=$event"
            echo "schedule=$EVENT_SCHEDULE"
            echo "base=$base"
            echo "head=$head"
            echo "paths=$paths"
            if [[ "$event" == "pull_request" && "$PR_FORK" == "true" ]]; then echo "fork=true"; else echo "fork=false"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Generate and validate provider-neutral CI plan
        id: plan
        env:
          EVENT: ${{ steps.context.outputs.event }}
          BASE: ${{ steps.context.outputs.base }}
          HEAD: ${{ steps.context.outputs.head }}
          SCHEDULE: ${{ steps.context.outputs.schedule }}
          PATHS: ${{ steps.context.outputs.paths }}
          FORK: ${{ steps.context.outputs.fork }}
          FULL_RUN: ${{ github.event.inputs.full_run }}
          DIAGNOSTIC: ${{ github.event.inputs.diagnostic }}
        shell: bash
        run: |
          plan="$RUNNER_TEMP/leantoken-ci-plan.json"
          overrides=()
          [[ "$FULL_RUN" == "true" ]] && overrides+=(--full-run)
          [[ "$DIAGNOSTIC" == "true" ]] && overrides+=(--diagnostic)
          [[ "$FORK" == "true" ]] && overrides+=(--fork)
          [[ -n "$SCHEDULE" ]] && overrides+=(--schedule "$SCHEDULE")
          cargo xtask ci plan \
            --event "$EVENT" \
            --base "$BASE" \
            --head "$HEAD" \
            --source "${{ github.sha }}" \
            --changed-paths-file "$PATHS" \
            "${overrides[@]}" \
            --output "$plan"
          cargo xtask ci validate-plan --input "$plan"
          echo "selected_lanes=$(jq -c '[.selected_lanes[].lane]' "$plan")" >> "$GITHUB_OUTPUT"
          echo "unselected_lanes=$(jq -c '[.unselected_lanes[].lane]' "$plan")" >> "$GITHUB_OUTPUT"
          echo "fallback_reason=$(jq -r '.fallback_reason // ""' "$plan")" >> "$GITHUB_OUTPUT"
          jq '{schema_version, event, schedule, source_revision, topology_digest, selected_lanes, unselected_lanes, fallback_reason}' "$plan" >> "$GITHUB_STEP_SUMMARY"
          selected=$(jq -r '[.selected_lanes[].lane] | join(",")' "$plan")
          echo "::notice::Selected CI lanes: $selected"

      - name: Export lane selectors
        id: filter
        env:
          SELECTED: ${{ steps.plan.outputs.selected_lanes }}
          CHANGED_PATHS: ${{ steps.context.outputs.paths }}
        shell: bash
        run: |
          has() { jq -e --arg lane "$1" 'index($lane) != null' <<< "$SELECTED" >/dev/null; }
          echo "manifests=$(has dependency-audit && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "npm=$(has npm && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "release=$(has release-plan && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "quality=$(has quality && echo true || echo false)" >> "$GITHUB_OUTPUT"
          if has product-linux || has product-macos || has product-windows; then product=true; else product=false; fi
          if has contract; then contract=true; else contract=false; fi
          if has examples; then examples=true; else examples=false; fi
          if has coverage; then coverage=true; else coverage=false; fi
          if [[ "$product" == true || "$contract" == true || "$examples" == true || "$coverage" == true ]]; then
            rust_quality=true
          else
            rust_quality=false
          fi
          topology=false
          if [[ -n "$CHANGED_PATHS" && -f "$CHANGED_PATHS" ]]; then
            if tr '\0' '\n' < "$CHANGED_PATHS" | grep -qx 'ci/test-topology.json'; then
              topology=true
            fi
          fi
          echo "topology=$topology" >> "$GITHUB_OUTPUT"
          echo "product=$product" >> "$GITHUB_OUTPUT"
          echo "contract=$contract" >> "$GITHUB_OUTPUT"
          echo "examples=$examples" >> "$GITHUB_OUTPUT"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          echo "rust_quality=$rust_quality" >> "$GITHUB_OUTPUT"

  quality:
    name: Code quality checks
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        if: needs.changes.outputs.npm == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        if: needs.changes.outputs.rust_quality == 'true' || needs.changes.outputs.topology == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        if: needs.changes.outputs.rust_quality == 'true' || needs.changes.outputs.topology == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-workspace-crates: true

      - name: Verify locked dependency graph
        if: needs.changes.outputs.rust_quality == 'true' || needs.changes.outputs.topology == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Check duplicate files
        run: bash scripts/check-duplicates.sh

      - name: Test development support scripts
        run: |
          python3 -m unittest \
            scripts/test_report_target_footprint.py \
            scripts/test_validate_agents_md.py

      - name: Validate AGENTS.md
        run: bash scripts/validate-agents-md.sh

      - name: Test npm packaging
        if: needs.changes.outputs.npm == 'true'
        run: node --test npm/npm-packaging.test.mjs

      - name: Check formatting
        if: needs.changes.outputs.rust_quality == 'true'
        run: cargo fmt --all -- --check

      - name: Check test architecture
        if: needs.changes.outputs.rust_quality == 'true' || needs.changes.outputs.topology == 'true'
        run: cargo xtask check-test-architecture

      - name: Lint all targets
        if: needs.changes.outputs.rust_quality == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Validate public API documentation
        if: needs.changes.outputs.rust_quality == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

      - name: Upload documentation for deployment
        if: needs.changes.outputs.rust_quality == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc/
          retention-days: 7

  secret-scan:
    name: Secret scan
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  dependency-audit:
    name: Dependency audit
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit
          cache-workspace-crates: true

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit

  unused-deps:
    name: Unused dependencies
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.manifests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: udeps
          cache-workspace-crates: true

      - name: Install cargo-udeps
        uses: taiki-e/install-action@cargo-udeps

      - name: Check unused dependencies
        run: cargo +nightly udeps --all-targets --all-features

  release-plan:
    name: Release plan
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install dist
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-dist@0.32.0

      - name: Validate release plan
        run: dist plan

  ci:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.product == 'true' || needs.changes.outputs.contract == 'true' || needs.changes.outputs.npm == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        if: needs.changes.outputs.npm == 'true' && matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Rust
        if: needs.changes.outputs.product == 'true' || needs.changes.outputs.contract == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        if: needs.changes.outputs.product == 'true' || needs.changes.outputs.contract == 'true'
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-workspace-crates: true

      - name: Install nextest
        if: needs.changes.outputs.product == 'true'
        uses: taiki-e/install-action@nextest

      - name: Test npm installation
        if: needs.changes.outputs.npm == 'true' && matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: node --test npm/npm-install-e2e.mjs

      - name: Test product behavior
        if: needs.changes.outputs.product == 'true'
        timeout-minutes: 15
        run: |
          started=$(date +%s)
          cargo xtask test product --parallel
          elapsed=$(( $(date +%s) - started ))
          echo "Product nextest lane (${elapsed}s; cache-hit=${{ steps.rust-cache.outputs.cache-hit || 'unknown' }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Test token-economy contract
        if: needs.changes.outputs.contract == 'true'
        timeout-minutes: 10
        run: cargo test-contract

      - name: Upload preserved test failures
        if: always() && (needs.changes.outputs.product == 'true' || needs.changes.outputs.contract == 'true')
        uses: actions/upload-artifact@v7
        with:
          name: test-failures-${{ matrix.os }}-${{ github.sha }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 7

  scheduled-stress:
    name: Nightly stress (${{ matrix.os }})
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.full_run || inputs.diagnostic))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            repetitions: 100
          - os: macos-latest
            repetitions: 25
          - os: windows-latest
            repetitions: 25
    defaults:
      run:
        shell: bash
    env:
      LEANTOKEN_STRESS_REPETITIONS: ${{ matrix.repetitions }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: stress-${{ matrix.os }}
          cache-workspace-crates: true

      - name: Run repeated process lifecycle evidence
        run: cargo xtask test stress

      - name: Upload preserved test failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-failures-${{ matrix.os }}-${{ github.sha }}
          path: target/test-failures/
          if-no-files-found: ignore
          retention-days: 14

  scheduled-profile:
    name: Weekly test profile
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: profile
          cache-workspace-crates: true

      - name: Profile merge tests without retries
        run: cargo xtask test profile

  example-tests:
    name: Benchmark and example tests
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: example-tests
          cache-workspace-crates: true

      - name: Test benchmark, example, and documentation targets
        run: |
          cargo test --locked --package leantoken-benchmarks --bins
          cargo test --locked --workspace --all-features --doc

      - name: Test performance support scripts
        run: |
          python3 -m unittest \
            scripts/test_agent_walltime_ab.py \
            scripts/test_paired_performance.py

  required:
    name: Required checks
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs:
      - changes
      - quality
      - secret-scan
      - dependency-audit
      - unused-deps
      - release-plan
      - ci
      - example-tests
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      UNUSED_DEPS_RESULT: ${{ needs.unused-deps.result }}
      RELEASE_PLAN_RESULT: ${{ needs.release-plan.result }}
      PRODUCT_RESULT: ${{ needs.ci.result }}
      EXAMPLE_TESTS_RESULT: ${{ needs.example-tests.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
      MANIFESTS_CHANGED: ${{ needs.changes.outputs.manifests }}
      RELEASE_CHANGED: ${{ needs.changes.outputs.release }}
      PRODUCT_SELECTED: ${{ needs.changes.outputs.product }}
      CONTRACT_SELECTED: ${{ needs.changes.outputs.contract }}
      NPM_SELECTED: ${{ needs.changes.outputs.npm }}
      EXAMPLES_SELECTED: ${{ needs.changes.outputs.examples }}
      COVERAGE_SELECTED: ${{ needs.changes.outputs.coverage }}
      SELECTED_LANES: ${{ needs.changes.outputs.selected_lanes }}
      UNSELECTED_LANES: ${{ needs.changes.outputs.unselected_lanes }}
      FALLBACK_REASON: ${{ needs.changes.outputs.fallback_reason }}
    steps:
      - name: Verify relevant jobs passed
        run: |
          failed=0

          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with result '$result'"
              failed=1
            fi
          }

          result_for_lane() {
            case "$1" in
              quality) echo "$QUALITY_RESULT" ;;
              secret-scan) echo "$SECRET_SCAN_RESULT" ;;
              product-linux|product-macos|product-windows|contract|npm) echo "$PRODUCT_RESULT" ;;
              examples) echo "$EXAMPLE_TESTS_RESULT" ;;
              coverage) echo "$COVERAGE_RESULT" ;;
              dependency-audit) echo "$DEPENDENCY_AUDIT_RESULT" ;;
              release-plan) echo "$RELEASE_PLAN_RESULT" ;;
              *) echo invalid-plan ;;
            esac
          }

          require_when() {
            local condition="$1"
            local name="$2"
            local result="$3"
            if [[ "$condition" == "true" ]]; then
              require_success "$name" "$result"
            elif [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::$name unexpectedly finished with result '$result'"
              failed=1
            fi
          }

          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "::error::invalid-plan: planner finished with result '$CHANGES_RESULT'"
            exit 1
          fi
          if [[ -n "$FALLBACK_REASON" ]]; then
            echo "::warning::planner fallback: $FALLBACK_REASON"
          fi
          echo 'Selected lane decisions:'
          while IFS= read -r lane; do
            result=$(result_for_lane "$lane")
            case "$result" in
              success) echo "- $lane: passed" ;;
              skipped) echo "- $lane: unexpectedly skipped"; failed=1 ;;
              cancelled|failure|timed_out) echo "- $lane: failed/cancelled ($result)"; failed=1 ;;
              *) echo "- $lane: invalid-plan ($result)"; failed=1 ;;
            esac
          done < <(jq -r '.[]' <<< "$SELECTED_LANES")
          while IFS= read -r lane; do
            echo "- $lane: intentionally unselected"
          done < <(jq -r '.[]' <<< "$UNSELECTED_LANES")
          require_success "code quality" "$QUALITY_RESULT"
          require_success "secret scan" "$SECRET_SCAN_RESULT"
          require_when "$MANIFESTS_CHANGED" "dependency audit" "$DEPENDENCY_AUDIT_RESULT"
          require_when "$MANIFESTS_CHANGED" "unused dependencies" "$UNUSED_DEPS_RESULT"
          require_when "$RELEASE_CHANGED" "release plan" "$RELEASE_PLAN_RESULT"

          product_changed=false
          if [[ "$PRODUCT_SELECTED" == "true" || "$CONTRACT_SELECTED" == "true" || "$NPM_SELECTED" == "true" ]]; then
            product_changed=true
          fi
          require_when "$product_changed" "cross-platform product tests" "$PRODUCT_RESULT"
          require_when "$CONTRACT_SELECTED" "token-economy contract" "$PRODUCT_RESULT"
          require_when "$NPM_SELECTED" "npm installation" "$PRODUCT_RESULT"
          require_when "$EXAMPLES_SELECTED" "benchmark and example tests" "$EXAMPLE_TESTS_RESULT"
          require_when "$COVERAGE_SELECTED" "test coverage" "$COVERAGE_RESULT"

          exit "$failed"

  coverage:
    name: Test coverage
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      # Rust attributes `include!` bodies to both the physical source and the
      # include-only façade. Count the physical files, but not those duplicate
      # zero-coverage aliases or the subprocess-only CLI entrypoints; mixed
      # façades with executable logic stay gated.
      COVERAGE_IGNORE_REGEX: >-
        concurrency_profile\.rs$|/src/(cache|cli|doctor|indexer|mcp|parser|ranking|repository|setup|storage|watcher)\.rs$|/src/main/dispatch\.rs$|/src/services/(context|coverage|indexing|json|read|savings|search|startup|status)\.rs$
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          cache-workspace-crates: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Remove stale LLVM coverage targets
        # The Rust cache can retain instrumented binaries for source files
        # deleted by a refactor. Clearing only profraw files leaves those
        # obsolete coverage maps in the report and inflates its denominator.
        run: cargo llvm-cov clean --workspace

      - name: Run instrumented tests
        run: >
          cargo llvm-cov --locked --all-features --workspace --no-report
          -- --test-threads=2

      - name: Enforce line coverage and write LCOV
        if: success() || failure()
        run: >
          cargo llvm-cov report --lcov --output-path lcov.info
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"
          --fail-under-lines 50

      - name: Print coverage summary
        if: success() || failure()
        run: >
          cargo llvm-cov report
          --ignore-filename-regex "$COVERAGE_IGNORE_REGEX"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 7

  docs-deploy:
    name: Deploy API documentation
    needs: [changes, quality]
    if: needs.changes.outputs.rust_quality == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: rustdoc
          path: target/doc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/doc/
          destination_dir: api
