name: Release Please

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Create or update release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-please-plan
      cancel-in-progress: true
    if: |
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'push' ||
        (
          !contains(github.event.head_commit.message, '[skip ci]') &&
          !contains(github.event.head_commit.message, '[no-release]') &&
          !contains(github.event.head_commit.message, 'chore(main): release')
        )
      )

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_VERSION="${LATEST_TAG#v}"
          CURRENT_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
            echo "::notice::Package version $CURRENT_VERSION is awaiting its matching release tag; skipping release planning"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COMMITS_SINCE=$(git rev-list --count "${LATEST_TAG}..HEAD")
          echo "commits_since=$COMMITS_SINCE" >> "$GITHUB_OUTPUT"

          if [ "$COMMITS_SINCE" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for existing release PR
        id: existing-pr
        if: steps.version.outputs.skip != 'true'
        run: |
          echo "number=" >> "$GITHUB_OUTPUT"
          echo "branch=" >> "$GITHUB_OUTPUT"
          BRANCH="release-v${{ steps.version.outputs.new_version }}"
          EXISTING=$(gh pr list \
            --label autorelease \
            --state open \
            --base main \
            --head "$BRANCH" \
            --json number,headRefName \
            --jq '.[0] | "\(.number) \(.headRefName)"' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "number=$(echo "$EXISTING" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$EXISTING" | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch
        if: steps.version.outputs.skip != 'true'
        run: |
          EXISTING_BRANCH="${{ steps.existing-pr.outputs.branch }}"
          if [ -n "$EXISTING_BRANCH" ] && [ "$EXISTING_BRANCH" != "null" ]; then
            BRANCH="$EXISTING_BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard origin/main
          else
            BRANCH="release-v${{ steps.version.outputs.new_version }}"
            git checkout -b "$BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
        id: branch

      - name: Bump package version
        if: steps.version.outputs.skip != 'true'
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.new_version }}"/' Cargo.toml
          jq --arg version '${{ steps.version.outputs.new_version }}' \
            '.version = $version | .packages[0].version = $version' \
            server.json > server.json.tmp
          mv server.json.tmp server.json
          cargo metadata --format-version 1 > /dev/null

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          GENERATED_CHANGELOG="$RUNNER_TEMP/leantoken-changelog.md"
          git cliff --config cliff.toml \
            --github-repo "morluto/leantoken" \
            --tag "${{ steps.version.outputs.new_tag }}" \
            --output "$GENERATED_CHANGELOG" \
            ${{ steps.version.outputs.latest_tag }}..HEAD
          {
            cat "$GENERATED_CHANGELOG"
            printf '\n'
            awk '/^## / { found = 1 } found' CHANGELOG.md
          } > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push release branch
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md server.json
          git commit -m "chore(main): release leantoken ${{ steps.version.outputs.new_version }}" || echo "no changes to commit"
          git push --force origin "${{ steps.branch.outputs.branch }}"

      - name: Create or update release PR
        if: steps.version.outputs.skip != 'true'
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          VERSION="${{ steps.version.outputs.new_version }}"
          TAG="${{ steps.version.outputs.new_tag }}"
          BODY=$(git cliff \
            --config cliff.toml \
            --github-repo "morluto/leantoken" \
            --tag "$TAG" \
            ${{ steps.version.outputs.latest_tag }}..HEAD)

          EXISTING_NUMBER="${{ steps.existing-pr.outputs.number }}"
          if [ -n "$EXISTING_NUMBER" ] && [ "$EXISTING_NUMBER" != "null" ]; then
            gh pr edit "$EXISTING_NUMBER" \
              --title "chore(main): release leantoken $VERSION" \
              --body "$BODY"
            echo "Updated existing PR #$EXISTING_NUMBER"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(main): release leantoken $VERSION" \
              --label autorelease \
              --body "$BODY"
            echo "Created release PR"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'autorelease')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Verify release version
        id: version
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          title_version=$(grep -oP 'release leantoken \K[0-9]+\.[0-9]+\.[0-9]+' <<< "$PR_TITLE" || true)
          cargo_version=$(awk '
            $0 == "[package]" { in_package = 1; next }
            in_package && /^\[/ { exit }
            in_package && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)
          server_version=$(jq -r '.version' server.json)
          package_version=$(jq -r '.packages[0].version' server.json)

          if [[ -z "$title_version" || -z "$cargo_version" ]]; then
            echo "Could not determine the release version from the PR title and Cargo.toml" >&2
            exit 1
          fi
          if [[ "$checked_out_sha" != "$MERGE_COMMIT_SHA" ||
                "$title_version" != "$cargo_version" ||
                "$cargo_version" != "$server_version" ||
                "$server_version" != "$package_version" ]]; then
            echo "Release identity does not match: checkout=$checked_out_sha event=$MERGE_COMMIT_SHA title=$title_version cargo=$cargo_version server=$server_version package=$package_version" >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Dispatch release workflow
        run: |
          gh workflow run release.yml \
            --ref "${{ steps.version.outputs.tag }}" \
            --field tag="${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
