[package]
name = "leantoken-xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Repository-local test and architecture orchestration"
[lints]
workspace = true

[dependencies]
blake3 = "1.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.110", default-features = false, features = ["full", "parsing", "visit"] }
